# Build and packaging checks. Nothing here needs Wi-Fi hardware or root on a
# real system, and nothing is published: packages are only kept as workflow
# artifacts for inspection.
name: CI

on:
  # Other branches are checked through their pull requests, so each change
  # runs once rather than once per push and once per PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang pkgconf libnl-3-dev libnl-genl-3-dev libpcap-dev
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }}
      - run: ./scandump --version
      - name: Tests
        run: make CC=${{ matrix.cc }} check
      - name: Staged install and uninstall
        run: |
          stage="$RUNNER_TEMP/stage"
          make install DESTDIR="$stage"
          test -x "$stage/usr/bin/scandump"
          test -f "$stage/usr/share/man/man8/scandump.8"
          make uninstall DESTDIR="$stage"
          test -z "$(find "$stage" -type f)"

  release-tarball:
    name: Build from release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkgconf libnl-3-dev libnl-genl-3-dev libpcap-dev
      - name: make dist, then build outside the Git checkout
        run: |
          make dist
          version=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' scandump.c)
          tar -C "$RUNNER_TEMP" -xzf "scandump-$version.tar.gz"
          cd "$RUNNER_TEMP/scandump-$version"
          test ! -e debian
          make
          ./scandump --version | grep -qx "scandump version $version"
          make install DESTDIR="$RUNNER_TEMP/stage"

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkgconf libnl-3-dev libnl-genl-3-dev libpcap-dev cppcheck mandoc
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --std=c99 --quiet \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            -I/usr/include/libnl3 scandump.c
      - name: GCC static analyzer
        run: make CFLAGS="-O2 -fanalyzer"
      - name: Manual page lint
        run: mandoc -Tlint -W warning scandump.8

  debian:
    name: Debian package (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Trixie's lintian warns about a Standards-Version it does not
          # know yet, so this job fails on errors only.
          - image: debian:trixie
            artifact: deb-debian-trixie
            lintian-fail-on: error
    steps:
      # Without git in the container, checkout downloads a GitHub archive,
      # which honors .gitattributes export-ignore and so has no debian/.
      - name: Install git
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Build, lint, install, test, remove
        run: sh packaging/ci/build-deb.sh
        env:
          LINTIAN_FAIL_ON: ${{ matrix.lintian-fail-on }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/deb/
